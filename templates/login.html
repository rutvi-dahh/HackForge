{% extends "base.html" %}

{% block title %}Sign In - Receipt Graveyard{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="card" style="padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🪦</div>
      <h1 class="page-title" style="font-size: 1.5rem;">Sign In</h1>
      <p class="page-subtitle">Access your reimbursement portal or review queue</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. admin@company.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </div>
    </form>

    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle);">
      <div style="font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 0.75rem; text-align: center;">
        ⚡ Instant Demo Account Switcher
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemo('admin@company.com', 'admin123')">
          👑 Admin (ADM01)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemo('e1@company.com', 'emp123')">
          👤 Alex (E1)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemo('e2@company.com', 'emp123')">
          👤 Bhavna (E2)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="setDemo('e3@company.com', 'emp123')">
          👤 Claire (E3)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" style="grid-column: span 2;" onclick="setDemo('e4@company.com', 'emp123')">
          👤 David (E4)
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function setDemo(email, pwd) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pwd;
}
</script>
{% endblock %}
